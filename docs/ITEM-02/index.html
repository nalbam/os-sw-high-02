<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#f3ecdc" />
<title>이번 주 청소 당번</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3ecdc;
    --paper-soft: #fffbf0;
    --ink: #2a2620;
    --ink-soft: #6b6358;
    --ink-fade: #b3a994;

    --board:       #2f5d4a;
    --board-edge:  #6b4a2a;
    --chalk:       #fefef0;
    --chalk-soft:  #e3e3c4;
    --chalk-pink:  #ffb6c4;
    --chalk-mint:  #b8f0c4;
    --chalk-yellow:#ffe78a;
    --chalk-blue:  #a6cfff;

    --tape: rgba(255, 230, 120, 0.78);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Gowun Dodum", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    font-size: 17px;
    line-height: 1.55;
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior-y: contain;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 14% 18%, rgba(255, 200, 110, 0.10) 0, transparent 45%),
      radial-gradient(circle at 86% 76%, rgba(120, 200, 150, 0.10) 0, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 520px;
    margin: 0 auto;
    padding: 28px 22px calc(120px + env(safe-area-inset-bottom));
  }

  header { margin-bottom: 22px; }

  .badge-stamp {
    display: inline-block;
    font-family: "Jua", "Gaegu", sans-serif;
    font-size: 14px;
    color: var(--board);
    border: 2.5px solid var(--board);
    padding: 3px 10px 2px;
    border-radius: 8px;
    transform: rotate(-2deg);
    letter-spacing: 1px;
    margin-bottom: 6px;
    background: rgba(255, 255, 255, 0.4);
  }

  .title {
    font-family: "Jua", sans-serif;
    font-size: 40px;
    color: var(--ink);
    margin: 0;
    letter-spacing: -1.5px;
    line-height: 1.05;
    position: relative;
    display: inline-block;
  }
  .title::after {
    content: "";
    position: absolute;
    left: -4px;
    right: -4px;
    bottom: 4px;
    height: 14px;
    background: var(--chalk-yellow);
    z-index: -1;
    opacity: 0.85;
    transform: skewX(-4deg);
    border-radius: 2px;
  }
  .subtitle {
    font-family: "Gaegu", sans-serif;
    font-size: 19px;
    color: var(--ink-soft);
    margin: 8px 0 0;
    letter-spacing: -0.4px;
  }

  /* 칠판 카드 — 이번 주 당번 */
  .board {
    margin-top: 22px;
    position: relative;
    padding: 28px 22px 26px;
    background: var(--board);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.04) 0, transparent 40%),
      radial-gradient(circle at 70% 70%, rgba(255,255,255,0.05) 0, transparent 45%);
    border: 8px solid var(--board-edge);
    border-radius: 18px;
    box-shadow: 5px 5px 0 0 var(--ink);
    color: var(--chalk);
    text-align: center;
    overflow: hidden;
  }
  .board::after {
    content: "";
    position: absolute;
    bottom: -16px;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 10px;
    background: rgba(0,0,0,0.12);
    filter: blur(6px);
    border-radius: 50%;
    pointer-events: none;
  }

  .board .week-label {
    font-family: "Gaegu", sans-serif;
    font-size: 18px;
    color: var(--chalk-soft);
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .board .name {
    font-family: "Jua", sans-serif;
    font-size: clamp(48px, 14vw, 68px);
    letter-spacing: -1px;
    line-height: 1.05;
    color: var(--chalk);
    word-break: keep-all;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.15);
  }
  .board .name.empty { color: var(--chalk-soft); font-size: 28px; padding: 18px 0; }
  .board .range {
    font-family: "Gaegu", sans-serif;
    font-size: 17px;
    color: var(--chalk-soft);
    margin-top: 10px;
    letter-spacing: 0.3px;
  }

  .upcoming {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1.5px dashed rgba(255,255,255,0.25);
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .upcoming-chip {
    background: rgba(255,255,255,0.08);
    border: 1.5px dashed rgba(255,255,255,0.35);
    border-radius: 12px;
    padding: 8px 14px;
    font-family: "Gaegu", sans-serif;
    color: var(--chalk);
    font-size: 16px;
    letter-spacing: -0.3px;
  }
  .upcoming-chip .who {
    color: var(--chalk-yellow);
    font-weight: 700;
    margin-left: 6px;
  }

  /* 종이 카드 — 친구 명단 / 맞추기 */
  .panel {
    margin-top: 22px;
    padding: 18px 18px 16px;
    background: var(--paper-soft);
    border: 2px solid var(--ink);
    border-radius: 18px;
    box-shadow: 5px 5px 0 0 var(--ink);
    position: relative;
  }
  .panel::before {
    content: "";
    position: absolute;
    top: -10px;
    left: 24px;
    width: 70px;
    height: 16px;
    background: var(--tape);
    transform: rotate(-3deg);
    border-radius: 1px;
    box-shadow: 0 1px 1px rgba(0,0,0,0.08);
  }

  .panel-title {
    font-family: "Jua", sans-serif;
    font-size: 22px;
    margin: 0 0 12px;
    letter-spacing: -0.5px;
  }

  .names {
    list-style: none;
    padding: 0;
    margin: 0 0 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .names li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    transition: transform 120ms ease;
  }
  .names li.current {
    background: var(--chalk-yellow);
    transform: translateX(2px);
    box-shadow: 2px 2px 0 0 var(--ink);
  }
  .names .order {
    font-family: "Jua", sans-serif;
    font-size: 18px;
    color: var(--ink-soft);
    width: 26px;
    text-align: center;
    line-height: 1;
  }
  .names li.current .order { color: var(--ink); }
  .names .name {
    flex: 1;
    font-family: "Gaegu", sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.4px;
  }
  .names .current-badge {
    font-family: "Jua", sans-serif;
    font-size: 13px;
    background: var(--ink);
    color: var(--chalk);
    padding: 3px 9px 2px;
    border-radius: 999px;
    letter-spacing: 0.5px;
  }
  .names .del-btn {
    background: transparent;
    border: none;
    color: var(--ink-fade);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    transition: color 120ms;
  }
  .names .del-btn:hover { color: var(--ink); }

  .empty-names {
    text-align: center;
    color: var(--ink-fade);
    font-family: "Gaegu", sans-serif;
    font-size: 18px;
    padding: 20px 0;
    letter-spacing: -0.3px;
  }

  .row {
    display: flex;
    gap: 8px;
  }

  .field-input,
  .field-select {
    flex: 1;
    min-width: 0;
    height: 50px;
    border: 1.5px dashed var(--ink-fade);
    background: transparent;
    font-family: "Gowun Dodum", sans-serif;
    font-size: 16px;
    color: var(--ink);
    padding: 0 14px;
    outline: none;
    border-radius: 12px;
  }
  .field-select {
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b6358' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 36px;
    font-family: "Gaegu", sans-serif;
    font-size: 18px;
    font-weight: 700;
  }
  .field-input:focus,
  .field-select:focus { border-color: var(--ink); border-style: solid; }
  .field-input::placeholder { color: var(--ink-fade); }

  .primary-btn {
    flex: 0 0 auto;
    height: 50px;
    min-width: 76px;
    border: 2px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    font-family: "Jua", sans-serif;
    font-size: 20px;
    border-radius: 12px;
    cursor: pointer;
    padding: 0 18px;
    transition: transform 80ms ease;
    letter-spacing: -0.5px;
  }
  .primary-btn:active { transform: translateY(2px) scale(0.98); }
  .primary-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .hint {
    font-family: "Gaegu", sans-serif;
    font-size: 15px;
    color: var(--ink-fade);
    margin-top: 10px;
    text-align: center;
    letter-spacing: -0.3px;
  }

  .footer-note {
    margin-top: 40px;
    text-align: center;
    font-family: "Gaegu", sans-serif;
    font-size: 16px;
    color: var(--ink-fade);
    letter-spacing: -0.3px;
  }

  @media (max-width: 380px) {
    .wrap { padding: 22px 16px calc(120px + env(safe-area-inset-bottom)); }
    .title { font-size: 34px; }
    .board { padding: 22px 18px 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge-stamp">CLEAN DUTY</span>
    <h1 class="title">청소 당번</h1>
    <p class="subtitle">월요일마다 자동으로 넘어가요 🧹</p>
  </header>

  <div class="board">
    <div class="week-label">이번 주 당번은</div>
    <div class="name" id="today-name">—</div>
    <div class="range" id="week-range"></div>
    <div class="upcoming" id="upcoming"></div>
  </div>

  <section class="panel">
    <h2 class="panel-title">친구 명단</h2>
    <ul class="names" id="names-list"></ul>
    <div class="row">
      <input class="field-input" type="text" id="name-input" placeholder="이름 입력 (예: 김민준)" maxlength="20" />
      <button class="primary-btn" id="add-btn">＋ 추가</button>
    </div>
  </section>

  <section class="panel">
    <h2 class="panel-title">이번 주 당번 맞추기</h2>
    <div class="row">
      <select class="field-select" id="sync-select"></select>
      <button class="primary-btn" id="sync-btn">맞추기</button>
    </div>
    <p class="hint">실제 반의 당번 순서에 한 번만 맞춰 주세요</p>
  </section>

  <div class="footer-note">데이터는 이 폰에만 저장돼요</div>
</div>

<script>
(() => {
  const STORAGE_KEY = "cleanup-duty-state-v2";

  let state = loadState() || {
    names: [],
    anchorMonday: toISODate(getMondayOf(new Date())),
    anchorIndex: 0,
  };

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || !Array.isArray(s.names) || typeof s.anchorMonday !== "string"
          || typeof s.anchorIndex !== "number") {
        return null;
      }
      return s;
    } catch { return null; }
  }
  function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

  function getMondayOf(date) {
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d;
  }
  function toISODate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${dd}`;
  }
  function fromISODate(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function addDays(d, n) {
    const r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    r.setDate(r.getDate() + n);
    return r;
  }
  function weeksBetween(fromMonday, toMonday) {
    const ms = toMonday.getTime() - fromMonday.getTime();
    return Math.round(ms / (7 * 24 * 60 * 60 * 1000));
  }
  function formatKoreanDate(d) { return `${d.getMonth() + 1}월 ${d.getDate()}일`; }
  function formatWeekRange(monday) {
    const sun = addDays(monday, 6);
    return `${formatKoreanDate(monday)} ~ ${formatKoreanDate(sun)}`;
  }

  function dutyAt(weekOffset) {
    if (state.names.length === 0) return null;
    const anchor = fromISODate(state.anchorMonday);
    const target = addDays(anchor, 7 * (currentWeekOffset() + weekOffset));
    const offsetFromAnchor = weeksBetween(anchor, target);
    const idx = ((state.anchorIndex + offsetFromAnchor) % state.names.length
      + state.names.length) % state.names.length;
    return { name: state.names[idx], monday: target, index: idx };
  }
  function currentWeekOffset() {
    const todayMonday = getMondayOf(new Date());
    return weeksBetween(fromISODate(state.anchorMonday), todayMonday);
  }

  const $today = document.getElementById("today-name");
  const $range = document.getElementById("week-range");
  const $upcoming = document.getElementById("upcoming");
  const $list = document.getElementById("names-list");
  const $input = document.getElementById("name-input");
  const $addBtn = document.getElementById("add-btn");
  const $select = document.getElementById("sync-select");
  const $syncBtn = document.getElementById("sync-btn");

  function render() {
    const current = dutyAt(0);
    if (!current) {
      $today.textContent = "친구를 먼저 추가해 줘";
      $today.classList.add("empty");
      $range.textContent = "";
      $upcoming.innerHTML = "";
    } else {
      $today.textContent = current.name;
      $today.classList.remove("empty");
      $range.textContent = formatWeekRange(current.monday);
      const next1 = dutyAt(1);
      const next2 = dutyAt(2);
      $upcoming.innerHTML = `
        <div class="upcoming-chip">다음 주<span class="who">${escapeHtml(next1.name)}</span></div>
        <div class="upcoming-chip">그 다음 주<span class="who">${escapeHtml(next2.name)}</span></div>
      `;
    }

    $list.innerHTML = "";
    if (state.names.length === 0) {
      const li = document.createElement("li");
      li.className = "empty-names";
      li.textContent = "아직 등록된 친구가 없어요 🙋";
      $list.appendChild(li);
    } else {
      const currentIdx = current ? current.index : -1;
      state.names.forEach((name, i) => {
        const li = document.createElement("li");
        if (i === currentIdx) li.classList.add("current");
        li.innerHTML = `
          <span class="order">${i + 1}</span>
          <span class="name"></span>
          ${i === currentIdx ? '<span class="current-badge">이번 주</span>' : ""}
          <button class="del-btn" aria-label="삭제" title="삭제">×</button>
        `;
        li.querySelector(".name").textContent = name;
        li.querySelector(".del-btn").addEventListener("click", () => removeName(i));
        $list.appendChild(li);
      });
    }

    const prev = $select.value;
    $select.innerHTML = "";
    if (state.names.length === 0) {
      const opt = document.createElement("option");
      opt.textContent = "친구를 먼저 추가해 주세요";
      opt.disabled = true;
      opt.selected = true;
      $select.appendChild(opt);
      $syncBtn.disabled = true;
    } else {
      state.names.forEach((name, i) => {
        const opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = name;
        $select.appendChild(opt);
      });
      if (prev && Number(prev) < state.names.length) {
        $select.value = prev;
      } else if (current) {
        $select.value = String(current.index);
      }
      $syncBtn.disabled = false;
    }
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function addName() {
    const v = $input.value.trim();
    if (!v) return;
    if (state.names.includes(v)) {
      $input.select();
      return;
    }
    state.names.push(v);
    $input.value = "";
    saveState();
    render();
  }

  function removeName(index) {
    const name = state.names[index];
    if (!confirm(`'${name}' 님을 명단에서 빼시겠어요?`)) return;
    const current = dutyAt(0);
    state.names.splice(index, 1);
    if (state.names.length === 0) {
      state.anchorIndex = 0;
    } else if (current) {
      let newIdx;
      if (index === current.index) {
        newIdx = current.index % state.names.length;
      } else if (index < current.index) {
        newIdx = current.index - 1;
      } else {
        newIdx = current.index;
      }
      state.anchorMonday = toISODate(getMondayOf(new Date()));
      state.anchorIndex = newIdx;
    }
    saveState();
    render();
  }

  function syncCurrent() {
    if (state.names.length === 0) return;
    const idx = Number($select.value);
    if (Number.isNaN(idx)) return;
    state.anchorMonday = toISODate(getMondayOf(new Date()));
    state.anchorIndex = idx;
    saveState();
    render();
  }

  $addBtn.addEventListener("click", addName);
  $input.addEventListener("keydown", (e) => { if (e.key === "Enter") addName(); });
  $syncBtn.addEventListener("click", syncCurrent);

  setInterval(() => {
    const now = new Date();
    if (now.getHours() === 0 && now.getMinutes() < 5) render();
  }, 60 * 1000);

  render();
})();
</script>
</body>
</html>

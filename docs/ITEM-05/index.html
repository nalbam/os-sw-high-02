<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#e8d9b8" />
<title>공지 모아보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:       #e8d9b8;
    --paper-soft:  #fffbf0;
    --ink:         #2a2620;
    --ink-soft:    #6b6358;
    --ink-fade:    #b3a994;

    --note-yellow: #fff39a;
    --note-pink:   #ffc1c1;
    --note-mint:   #b6f0c8;
    --note-sky:    #b9dcff;
    --note-peach:  #ffd6a5;

    --important:   #e94444;
    --normal:      #2563eb;
    --low:         #8a8475;

    --pin-red:     #e94444;
    --pin-blue:    #2563eb;
    --pin-green:   #3aaa6b;
    --tape:        rgba(255, 230, 120, 0.78);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    font-family: "Gowun Dodum", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    font-size: 17px;
    line-height: 1.55;
    overscroll-behavior-y: contain;
  }

  /* 코르크 보드 텍스처 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 25% 25%, rgba(120, 80, 40, 0.07) 0, transparent 30%),
      radial-gradient(circle at 75% 75%, rgba(120, 80, 40, 0.06) 0, transparent 30%),
      radial-gradient(circle at 50% 50%, rgba(80, 60, 30, 0.04) 0, transparent 35%);
    background-size: 80px 80px, 120px 120px, 60px 60px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 14% 18%, rgba(255, 200, 110, 0.12) 0, transparent 45%),
      radial-gradient(circle at 86% 80%, rgba(200, 130, 70, 0.08) 0, transparent 50%);
    pointer-events: none;
    z-index: 1;
  }

  .container {
    position: relative;
    z-index: 2;
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 22px calc(120px + env(safe-area-inset-bottom));
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 22px;
    gap: 14px;
  }
  .header-left {
    flex: 1;
    min-width: 0;
  }
  .badge-stamp {
    display: inline-block;
    font-family: "Jua", "Gaegu", sans-serif;
    font-size: 14px;
    color: var(--important);
    border: 2.5px solid var(--important);
    padding: 3px 10px 2px;
    border-radius: 8px;
    transform: rotate(-2deg);
    letter-spacing: 1px;
    margin-bottom: 6px;
    background: rgba(255, 255, 255, 0.4);
  }
  .title {
    font-family: "Jua", sans-serif;
    font-size: 40px;
    color: var(--ink);
    margin: 0;
    letter-spacing: -1.5px;
    line-height: 1.05;
    position: relative;
    display: inline-block;
  }
  .title::after {
    content: "";
    position: absolute;
    left: -4px;
    right: -4px;
    bottom: 4px;
    height: 14px;
    background: var(--note-pink);
    z-index: -1;
    opacity: 0.85;
    transform: skewX(-4deg);
    border-radius: 2px;
  }
  .count {
    font-family: "Jua", sans-serif;
    font-size: 14px;
    color: var(--paper-soft);
    background: var(--ink);
    padding: 6px 12px;
    border-radius: 999px;
    white-space: nowrap;
    letter-spacing: -0.3px;
  }
  .count.zero { background: var(--ink-fade); }

  /* 추가 폼 — 종이 카드 */
  .form {
    margin-bottom: 28px;
    padding: 18px 18px 16px;
    background: var(--paper-soft);
    border: 2px solid var(--ink);
    border-radius: 18px;
    box-shadow: 5px 5px 0 0 var(--ink);
    position: relative;
  }
  .form::before {
    content: "";
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%) rotate(-2deg);
    width: 70px;
    height: 16px;
    background: var(--tape);
    border-radius: 1px;
    box-shadow: 0 1px 1px rgba(0,0,0,0.08);
  }
  .form-title {
    font-family: "Jua", sans-serif;
    font-size: 22px;
    margin: 0 0 12px;
    letter-spacing: -0.5px;
  }
  .form > .field + .field { margin-top: 10px; }

  .field-input,
  .field-select {
    width: 100%;
    height: 50px;
    border: 1.5px dashed var(--ink-fade);
    background: transparent;
    font-family: "Gowun Dodum", sans-serif;
    font-size: 16px;
    color: var(--ink);
    padding: 0 14px;
    outline: none;
    border-radius: 12px;
  }
  .field-select {
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b6358' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 36px;
    font-family: "Gaegu", sans-serif;
    font-size: 18px;
    font-weight: 700;
  }
  .field-input:focus,
  .field-select:focus { border-color: var(--ink); border-style: solid; }
  .field-input::placeholder { color: var(--ink-fade); }

  .add-btn {
    width: 100%;
    height: 54px;
    border: 2px solid var(--ink);
    background: var(--ink);
    color: var(--paper-soft);
    font-family: "Jua", sans-serif;
    font-size: 22px;
    border-radius: 14px;
    cursor: pointer;
    margin-top: 12px;
    transition: transform 80ms ease;
    letter-spacing: -0.5px;
  }
  .add-btn:active { transform: translateY(2px) scale(0.99); }

  /* 공지 카드 */
  .list {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .empty {
    text-align: center;
    color: var(--ink-fade);
    padding: 56px 16px;
    font-family: "Gaegu", sans-serif;
    font-size: 22px;
    line-height: 1.5;
    letter-spacing: -0.4px;
  }
  .empty strong {
    color: var(--ink-soft);
    font-weight: 700;
  }

  .card {
    position: relative;
    padding: 22px 20px 18px;
    background: var(--note-yellow);
    border: 2px solid var(--ink);
    border-radius: 14px;
    box-shadow: 4px 4px 0 0 var(--ink);
    cursor: pointer;
    transition: transform 0.08s, opacity 0.2s;
    animation: pop 320ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.95) translateY(-4px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .card:active { transform: scale(0.99); }

  .card:nth-child(5n+1) { background: var(--note-yellow); transform: rotate(-0.5deg); }
  .card:nth-child(5n+2) { background: var(--note-mint);   transform: rotate(0.6deg); }
  .card:nth-child(5n+3) { background: var(--note-sky);    transform: rotate(-0.4deg); }
  .card:nth-child(5n+4) { background: var(--note-peach);  transform: rotate(0.5deg); }
  .card:nth-child(5n+5) { background: var(--note-pink);   transform: rotate(-0.6deg); }

  /* 압정 */
  .card::before {
    content: "";
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 18px;
    height: 18px;
    background: radial-gradient(circle at 35% 35%, #fff8 0 18%, transparent 20%), var(--pin-color, var(--pin-red));
    border-radius: 50%;
    box-shadow: 0 2px 3px rgba(0,0,0,0.25), inset -1px -1px 2px rgba(0,0,0,0.2);
    z-index: 2;
  }
  .card.priority-important { --pin-color: var(--pin-red); }
  .card.priority-normal    { --pin-color: var(--pin-blue); }
  .card.priority-low       { --pin-color: var(--pin-green); }

  .card.important {
    border-color: var(--important);
    border-width: 2.5px;
  }
  .card.important::after {
    content: "중요";
    position: absolute;
    top: 8px;
    right: -6px;
    font-family: "Jua", sans-serif;
    font-size: 12px;
    background: var(--important);
    color: white;
    padding: 3px 10px 2px;
    border-radius: 4px 0 0 4px;
    letter-spacing: 1px;
    transform: rotate(0deg);
    box-shadow: -1px 2px 0 rgba(0,0,0,0.15);
  }

  .card .title-text {
    font-family: "Jua", sans-serif;
    font-size: 22px;
    font-weight: 400;
    margin: 0 0 6px;
    letter-spacing: -0.5px;
    color: var(--ink);
    word-break: keep-all;
    overflow-wrap: anywhere;
    line-height: 1.25;
  }
  .card .content {
    font-family: "Gowun Dodum", sans-serif;
    font-size: 15px;
    color: var(--ink);
    word-break: keep-all;
    overflow-wrap: anywhere;
    line-height: 1.55;
  }
  .card .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1.5px dashed rgba(42, 38, 32, 0.2);
    font-family: "Gaegu", sans-serif;
    font-size: 15px;
    color: var(--ink-soft);
    letter-spacing: -0.3px;
  }
  .card .check {
    font-family: "Jua", sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.5);
    padding: 3px 10px 2px;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    letter-spacing: -0.3px;
  }

  /* 읽음 */
  .card.read { opacity: 0.55; }
  .card.read .title-text { font-weight: 400; }
  .card.read .check {
    background: var(--ink);
    color: var(--paper-soft);
  }

  /* 7일 지남 */
  .card.stale { opacity: 0.4; filter: grayscale(0.6); }
  .card.read.stale { opacity: 0.28; }

  .footer-note {
    margin-top: 40px;
    text-align: center;
    font-family: "Gaegu", sans-serif;
    font-size: 16px;
    color: var(--ink-fade);
    letter-spacing: -0.3px;
  }

  @media (max-width: 380px) {
    .container { padding: 22px 16px calc(120px + env(safe-area-inset-bottom)); }
    .title { font-size: 34px; }
    .card .title-text { font-size: 20px; }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <span class="badge-stamp">NOTICE</span>
        <h1 class="title">공지 모아보기</h1>
      </div>
      <span class="count zero" id="count">—</span>
    </header>

    <form class="form" id="form" autocomplete="off">
      <h2 class="form-title">＋ 공지 적기</h2>
      <div class="field">
        <input class="field-input" id="title" type="text" placeholder="제목 (예: 수학 수행평가 안내)" required maxlength="60" />
      </div>
      <div class="field">
        <input class="field-input" id="content" type="text" placeholder="한 줄 내용" required maxlength="200" />
      </div>
      <div class="field">
        <select class="field-select" id="priority">
          <option value="low">낮음</option>
          <option value="normal" selected>보통</option>
          <option value="important">중요</option>
        </select>
      </div>
      <button class="add-btn" type="submit">＋ 추가</button>
    </form>

    <div class="list" id="list"></div>

    <div class="footer-note">카드를 톡 누르면 확인/취소 표시 ✏️</div>
  </div>

<script>
  const STORAGE_KEY = 'notices_v2';
  const STALE_MS = 7 * 24 * 60 * 60 * 1000;

  const $ = (id) => document.getElementById(id);

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch { return []; }
  }
  function save(notices) { localStorage.setItem(STORAGE_KEY, JSON.stringify(notices)); }

  function relativeTime(ts) {
    const diff = Date.now() - ts;
    const min = Math.floor(diff / 60000);
    if (min < 1)  return '방금 전';
    if (min < 60) return `${min}분 전`;
    const hr = Math.floor(min / 60);
    if (hr < 24)  return `${hr}시간 전`;
    const day = Math.floor(hr / 24);
    if (day < 7)  return `${day}일 전`;
    const week = Math.floor(day / 7);
    if (week < 5) return `${week}주 전`;
    const month = Math.floor(day / 30);
    return `${month}달 전`;
  }
  const isStale = (ts) => (Date.now() - ts) > STALE_MS;

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) =>
      ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  function render() {
    const list = $('list');
    const notices = load();

    const unread = notices.filter(n => !n.read).length;
    const cnt = $('count');
    if (notices.length === 0) {
      cnt.textContent = '비어있음';
      cnt.classList.add('zero');
    } else if (unread > 0) {
      cnt.textContent = `안 본 ${unread}개`;
      cnt.classList.remove('zero');
    } else {
      cnt.textContent = `모두 확인 · ${notices.length}개`;
      cnt.classList.add('zero');
    }

    if (notices.length === 0) {
      list.innerHTML = `
        <div class="empty">
          <strong>아직 공지가 없어요 📭</strong><br>
          위에서 첫 공지를 적어보자
        </div>`;
      return;
    }

    const sorted = [...notices].sort((a, b) => {
      const ai = a.priority === 'important' ? 1 : 0;
      const bi = b.priority === 'important' ? 1 : 0;
      if (ai !== bi) return bi - ai;
      return b.createdAt - a.createdAt;
    });

    list.innerHTML = sorted.map(n => {
      const classes = [
        'card',
        `priority-${n.priority}`,
        n.priority === 'important' ? 'important' : '',
        n.read ? 'read' : '',
        isStale(n.createdAt) ? 'stale' : ''
      ].filter(Boolean).join(' ');
      return `
        <div class="${classes}" data-id="${n.id}">
          <div class="title-text">${escapeHtml(n.title)}</div>
          <div class="content">${escapeHtml(n.content)}</div>
          <div class="meta">
            <span>${relativeTime(n.createdAt)}</span>
            <span class="check">${n.read ? '확인함 ✓' : '안 본 공지'}</span>
          </div>
        </div>`;
    }).join('');
  }

  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const title = $('title').value.trim();
    const content = $('content').value.trim();
    const priority = $('priority').value;
    if (!title || !content) return;

    const notices = load();
    notices.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      title, content, priority,
      createdAt: Date.now(),
      read: false
    });
    save(notices);

    e.target.reset();
    $('priority').value = 'normal';
    $('title').focus();
    render();
  });

  $('list').addEventListener('click', (e) => {
    const card = e.target.closest('.card');
    if (!card) return;
    const id = card.dataset.id;
    const notices = load();
    const target = notices.find(n => n.id === id);
    if (!target) return;
    target.read = !target.read;
    save(notices);
    render();
  });

  render();
  setInterval(render, 60000);
</script>
</body>
</html>

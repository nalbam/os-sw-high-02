<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오늘 어디 가야 하지? · 우리반 시간표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  :root {
    --chalk-bg: #1f4a37;
    --chalk-bg-2: #1a3d2d;
    --chalk: #fefae0;
    --chalk-soft: #e9edc9;
    --chalk-pink: #ffc8dd;
    --chalk-yellow: #ffe169;
    --chalk-blue: #a2d2ff;
    --paper: #fffaf0;
    --paper-line: #d8e3f0;
    --paper-margin: #ff6b6b;
    --ink: #2b2d42;
    --ink-soft: #6b7280;
    --sticky-y: #fff3a3;
    --sticky-p: #ffd1dc;
    --sticky-b: #bde0fe;
    --sticky-g: #c9f2c7;
    --accent: #ef476f;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: 'Gaegu', 'Nanum Pen Script', system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse at 20% 0%, #fde2a7 0%, transparent 55%),
      radial-gradient(ellipse at 80% 100%, #c9f2c7 0%, transparent 55%),
      #fff7e6;
    min-height: 100vh;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 18px 16px 80px;
  }

  /* ===== Header ===== */
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .logo {
    font-family: 'Jua', sans-serif;
    font-size: 22px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo .pin {
    display: inline-block;
    width: 26px; height: 26px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: inset -3px -4px 0 rgba(0,0,0,.15);
    position: relative;
  }
  .logo .pin::after {
    content: '';
    position: absolute;
    left: 9px; top: 8px;
    width: 8px; height: 8px;
    background: #fff8;
    border-radius: 50%;
  }
  .date-stamp {
    font-family: 'Nanum Pen Script', cursive;
    font-size: 20px;
    color: var(--ink-soft);
    transform: rotate(-2deg);
    background: var(--sticky-y);
    padding: 4px 12px;
    border-radius: 4px;
    box-shadow: 2px 2px 0 rgba(0,0,0,.08);
  }

  /* ===== Blackboard (today's schedule) ===== */
  .board {
    background:
      repeating-linear-gradient(180deg, transparent 0 30px, rgba(255,255,255,.02) 30px 31px),
      linear-gradient(180deg, var(--chalk-bg) 0%, var(--chalk-bg-2) 100%);
    border: 14px solid #8b5a2b;
    border-radius: 10px;
    box-shadow:
      inset 0 0 60px rgba(0,0,0,.35),
      0 8px 0 #6b4423,
      0 14px 24px rgba(0,0,0,.18);
    padding: 22px 20px 26px;
    color: var(--chalk);
    position: relative;
    overflow: hidden;
  }
  .board::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 12% 88%, rgba(255,255,255,.06) 0 6px, transparent 8px),
      radial-gradient(circle at 78% 14%, rgba(255,255,255,.05) 0 4px, transparent 6px),
      radial-gradient(circle at 50% 95%, rgba(255,255,255,.04) 0 80px, transparent 120px);
    pointer-events: none;
  }
  .board-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  .board h1 {
    font-family: 'Gaegu', cursive;
    font-weight: 700;
    font-size: 30px;
    margin: 0;
    color: var(--chalk);
    text-shadow: 0 1px 0 rgba(0,0,0,.2);
    letter-spacing: 1px;
  }
  .board h1 .accent {
    color: var(--chalk-yellow);
  }
  .today-tag {
    font-family: 'Jua', sans-serif;
    background: rgba(255,255,255,.1);
    border: 1.5px dashed rgba(255,255,255,.4);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 14px;
    color: var(--chalk-soft);
  }

  .countdown {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 16px;
    border: 1.5px dashed rgba(255,255,255,.25);
  }
  .countdown .icon {
    font-size: 30px;
    line-height: 1;
  }
  .countdown .text {
    flex: 1;
    min-width: 0;
  }
  .countdown .label {
    font-family: 'Jua', sans-serif;
    font-size: 14px;
    color: var(--chalk-soft);
    opacity: .85;
  }
  .countdown .value {
    font-family: 'Gaegu', cursive;
    font-weight: 700;
    font-size: 26px;
    line-height: 1.1;
    color: var(--chalk-yellow);
    text-shadow: 0 0 14px rgba(255,225,105,.25);
    word-break: keep-all;
  }
  .countdown.empty .value { color: var(--chalk-soft); font-size: 20px; }

  .schedule {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .item {
    display: grid;
    grid-template-columns: 92px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 10px;
    background: rgba(255,255,255,.06);
    border-left: 4px solid var(--chalk-yellow);
    transition: opacity .2s, transform .15s;
  }
  .item.past {
    opacity: .35;
    text-decoration: line-through;
    text-decoration-color: rgba(255,255,255,.4);
    border-left-color: rgba(255,255,255,.2);
  }
  .item.next {
    background: rgba(255,225,105,.16);
    border-left-color: var(--chalk-pink);
    box-shadow: 0 0 0 1.5px rgba(255,200,221,.25) inset;
  }
  .item .time {
    font-family: 'Jua', sans-serif;
    font-size: 24px;
    color: var(--chalk-yellow);
    letter-spacing: 1px;
  }
  .item.past .time { color: var(--chalk-soft); }
  .item .name {
    font-family: 'Gaegu', cursive;
    font-weight: 700;
    font-size: 22px;
    color: var(--chalk);
    word-break: keep-all;
  }
  .item .badge {
    font-family: 'Jua', sans-serif;
    font-size: 12px;
    background: var(--chalk-pink);
    color: #6b2e3a;
    padding: 3px 9px;
    border-radius: 999px;
  }

  .empty-today {
    font-family: 'Gaegu', cursive;
    font-size: 26px;
    text-align: center;
    padding: 28px 10px;
    color: var(--chalk-soft);
  }
  .empty-today .big { font-size: 30px; color: var(--chalk-yellow); display: block; margin-bottom: 4px; }

  /* ===== Paper note ===== */
  .paper {
    margin-top: 26px;
    background:
      repeating-linear-gradient(180deg, transparent 0 31px, var(--paper-line) 31px 32px),
      var(--paper);
    border-radius: 6px;
    padding: 26px 22px 22px 64px;
    position: relative;
    box-shadow:
      0 1px 0 rgba(0,0,0,.06),
      0 12px 22px rgba(0,0,0,.08);
    border: 1px solid #ead9b5;
  }
  .paper::before {
    content: '';
    position: absolute;
    left: 48px; top: 0; bottom: 0;
    width: 2px;
    background: var(--paper-margin);
    opacity: .6;
  }
  .paper::after {
    content: '';
    position: absolute;
    left: 18px;
    top: 36px;
    width: 14px;
    height: calc(100% - 72px);
    background-image: radial-gradient(circle, #d8c79b 0 5px, transparent 6px);
    background-size: 14px 60px;
    background-repeat: repeat-y;
    opacity: .8;
  }

  .paper h2 {
    font-family: 'Jua', sans-serif;
    font-size: 22px;
    margin: 0 0 14px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .paper h2::before {
    content: '✏️';
    font-size: 22px;
  }

  .form {
    display: grid;
    grid-template-columns: 1fr 1fr 2fr auto;
    gap: 8px;
    margin-bottom: 18px;
  }
  .form select,
  .form input[type="time"],
  .form input[type="text"] {
    font-family: 'Gaegu', cursive;
    font-size: 18px;
    padding: 10px 12px;
    border: 2px dashed #b8b0a0;
    border-radius: 8px;
    background: rgba(255,255,255,.7);
    color: var(--ink);
    min-height: 44px;
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .form select:focus,
  .form input:focus {
    border-color: var(--accent);
    background: #fff;
  }
  .form button {
    font-family: 'Jua', sans-serif;
    font-size: 16px;
    padding: 0 16px;
    min-height: 44px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 3px 0 #b9304f;
    transition: transform .08s;
    white-space: nowrap;
  }
  .form button:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #b9304f;
  }

  .week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }
  .day {
    background: var(--sticky-y);
    border-radius: 6px;
    padding: 10px 8px 12px;
    min-height: 120px;
    box-shadow: 2px 3px 0 rgba(0,0,0,.06);
    transform: rotate(-1deg);
    position: relative;
  }
  .day:nth-child(2n) { background: var(--sticky-p); transform: rotate(1deg); }
  .day:nth-child(3n) { background: var(--sticky-b); transform: rotate(-1.5deg); }
  .day:nth-child(4n) { background: var(--sticky-g); transform: rotate(.8deg); }
  .day.is-today {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .day h3 {
    font-family: 'Jua', sans-serif;
    font-size: 15px;
    margin: 0 0 6px;
    text-align: center;
    color: var(--ink);
  }
  .day h3 .today-mark {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    margin-left: 4px;
    transform: translateY(-2px);
  }
  .day ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .day li {
    font-family: 'Gaegu', cursive;
    font-size: 14px;
    line-height: 1.2;
    background: rgba(255,255,255,.55);
    border-radius: 4px;
    padding: 4px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    word-break: keep-all;
  }
  .day li .lt { font-weight: 700; }
  .day li .ln { flex: 1; padding: 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .day li button {
    background: transparent;
    border: none;
    color: #b9304f;
    font-size: 18px;
    line-height: 1;
    padding: 0 2px;
    cursor: pointer;
    min-width: 22px;
    min-height: 22px;
  }
  .day li button:hover { color: #6b1530; }
  .day .none {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    margin-top: 6px;
    opacity: .7;
  }

  footer.tip {
    margin-top: 20px;
    text-align: center;
    font-family: 'Nanum Pen Script', cursive;
    color: var(--ink-soft);
    font-size: 18px;
  }

  /* ===== Responsive ===== */
  @media (max-width: 720px) {
    .week { grid-template-columns: repeat(2, 1fr); }
    .day { min-height: 90px; transform: none; }
    .day:nth-child(n) { transform: none; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 14px 12px 60px; }
    .board { border-width: 10px; padding: 18px 14px 20px; }
    .board h1 { font-size: 24px; }
    .form { grid-template-columns: 1fr 1fr; }
    .form input[type="text"] { grid-column: 1 / span 2; }
    .form button { grid-column: 1 / span 2; }
    .paper { padding: 22px 16px 18px 48px; }
    .paper::before { left: 32px; }
    .paper::after { left: 10px; }
    .item { grid-template-columns: 78px 1fr auto; gap: 8px; }
    .item .time { font-size: 20px; }
    .item .name { font-size: 18px; }
    .countdown .value { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">
      <span class="pin" aria-hidden="true"></span>
      <span>오늘 어디 가야 하지?</span>
    </div>
    <div class="date-stamp" id="dateStamp">로딩 중…</div>
  </header>

  <!-- ===== Blackboard ===== -->
  <section class="board" aria-label="오늘 일정">
    <div class="board-head">
      <h1>오늘의 <span class="accent">시간표</span></h1>
      <span class="today-tag" id="todayTag">오늘 ·</span>
    </div>

    <div class="countdown" id="countdown" aria-live="polite">
      <div class="icon">⏰</div>
      <div class="text">
        <div class="label">다음 일정까지</div>
        <div class="value" id="countdownValue">계산 중…</div>
      </div>
    </div>

    <div class="schedule" id="todayList"></div>
  </section>

  <!-- ===== Paper note ===== -->
  <section class="paper">
    <h2>일정 추가하기</h2>
    <form class="form" id="addForm" autocomplete="off">
      <select id="fDay" aria-label="요일">
        <option value="0">일요일</option>
        <option value="1">월요일</option>
        <option value="2">화요일</option>
        <option value="3">수요일</option>
        <option value="4">목요일</option>
        <option value="5">금요일</option>
        <option value="6">토요일</option>
      </select>
      <input type="time" id="fTime" required aria-label="시간" />
      <input type="text" id="fName" placeholder="예: 영어학원, 피아노 레슨…" required maxlength="30" aria-label="일정 이름" />
      <button type="submit">＋ 추가</button>
    </form>

    <h2 style="margin-top:4px;">요일별 일정</h2>
    <div class="week" id="week"></div>
  </section>

  <footer class="tip">– 학교 끝나고 어디로 가야 하는지 한눈에 확인하세요 –</footer>
</div>

<script>
(function () {
  'use strict';

  const STORAGE_KEY = 'school-schedule-v1';
  const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];
  const DAY_NAMES_FULL = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];

  /** @type {{id:string, day:number, time:string, name:string}[]} */
  let items = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (_) {}
    return seed();
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch (_) {}
  }

  function seed() {
    const today = new Date().getDay();
    const now = new Date();
    const hh = String(Math.min(23, now.getHours() + 1)).padStart(2,'0');
    const mm = '00';
    const otherA = (today + 1) % 7;
    const otherB = (today + 3) % 7;
    return [
      { id: rid(), day: today,  time: `${hh}:${mm}`, name: '영어 학원' },
      { id: rid(), day: otherA, time: '16:30',       name: '방과후 코딩' },
      { id: rid(), day: otherB, time: '19:00',       name: '수학 학원' },
    ];
  }

  function rid() {
    return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
  }

  function timeToMin(t) {
    const [h, m] = t.split(':').map(Number);
    return h * 60 + m;
  }

  function nowMin() {
    const d = new Date();
    return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
  }

  function render() {
    renderDate();
    renderToday();
    renderWeek();
    updateCountdown();
  }

  function renderDate() {
    const d = new Date();
    const stamp = `${d.getMonth()+1}월 ${d.getDate()}일 ${DAY_NAMES_FULL[d.getDay()]}`;
    document.getElementById('dateStamp').textContent = stamp;
    document.getElementById('todayTag').textContent = `오늘 · ${DAY_NAMES[d.getDay()]}요일`;
  }

  function renderToday() {
    const today = new Date().getDay();
    const list = items
      .filter(i => i.day === today)
      .slice()
      .sort((a, b) => timeToMin(a.time) - timeToMin(b.time));

    const container = document.getElementById('todayList');
    container.innerHTML = '';

    if (list.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-today';
      empty.innerHTML = `<span class="big">오늘 일정 없어요 ✨</span><span>푹 쉬는 것도 일정이에요!</span>`;
      container.appendChild(empty);
      return;
    }

    const n = nowMin();
    let nextAssigned = false;
    list.forEach(item => {
      const div = document.createElement('div');
      div.className = 'item';
      const itemMin = timeToMin(item.time);
      const isPast = itemMin < n;
      if (isPast) div.classList.add('past');
      else if (!nextAssigned) {
        div.classList.add('next');
        nextAssigned = true;
      }

      const badge = div.classList.contains('next')
        ? '<span class="badge">다음</span>'
        : (isPast ? '<span class="badge" style="background:#888;color:#fff;">완료</span>' : '');
      div.innerHTML = `
        <div class="time">${item.time}</div>
        <div class="name">${escapeHtml(item.name)}</div>
        <div>${badge}</div>
      `;
      container.appendChild(div);
    });
  }

  function renderWeek() {
    const week = document.getElementById('week');
    week.innerHTML = '';
    const today = new Date().getDay();

    for (let d = 0; d < 7; d++) {
      const dayItems = items
        .filter(i => i.day === d)
        .slice()
        .sort((a, b) => timeToMin(a.time) - timeToMin(b.time));

      const card = document.createElement('div');
      card.className = 'day' + (d === today ? ' is-today' : '');

      const h = document.createElement('h3');
      h.innerHTML = `${DAY_NAMES_FULL[d]}${d === today ? '<span class="today-mark">오늘</span>' : ''}`;
      card.appendChild(h);

      if (dayItems.length === 0) {
        const none = document.createElement('div');
        none.className = 'none';
        none.textContent = '— 없음 —';
        card.appendChild(none);
      } else {
        const ul = document.createElement('ul');
        dayItems.forEach(it => {
          const li = document.createElement('li');
          li.innerHTML = `
            <span class="lt">${it.time}</span>
            <span class="ln">${escapeHtml(it.name)}</span>
            <button type="button" aria-label="삭제" data-id="${it.id}">✕</button>
          `;
          ul.appendChild(li);
        });
        card.appendChild(ul);
      }
      week.appendChild(card);
    }
  }

  function updateCountdown() {
    const today = new Date().getDay();
    const list = items
      .filter(i => i.day === today)
      .slice()
      .sort((a, b) => timeToMin(a.time) - timeToMin(b.time));

    const cd = document.getElementById('countdown');
    const val = document.getElementById('countdownValue');
    cd.classList.remove('empty');

    if (list.length === 0) {
      cd.classList.add('empty');
      val.textContent = '오늘은 카운트다운 쉬는 날 🛋️';
      return;
    }

    const now = new Date();
    const nowSec = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();
    const upcoming = list.find(i => timeToMin(i.time)*60 > nowSec);

    if (!upcoming) {
      val.textContent = '오늘 일정 모두 끝! 👏';
      return;
    }

    const diff = timeToMin(upcoming.time)*60 - nowSec;
    const h = Math.floor(diff / 3600);
    const m = Math.floor((diff % 3600) / 60);
    const s = diff % 60;

    let txt;
    if (h > 0) txt = `${h}시간 ${m}분 ${String(s).padStart(2,'0')}초`;
    else if (m > 0) txt = `${m}분 ${String(s).padStart(2,'0')}초`;
    else txt = `${s}초`;

    val.textContent = `${upcoming.name} · ${txt} 남음`;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  document.getElementById('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const day = Number(document.getElementById('fDay').value);
    const time = document.getElementById('fTime').value;
    const name = document.getElementById('fName').value.trim();
    if (!time || !name) return;
    items.push({ id: rid(), day, time, name });
    save();
    document.getElementById('fName').value = '';
    render();
  });

  document.getElementById('week').addEventListener('click', e => {
    const btn = e.target.closest('button[data-id]');
    if (!btn) return;
    const id = btn.getAttribute('data-id');
    items = items.filter(i => i.id !== id);
    save();
    render();
  });

  document.getElementById('fDay').value = String(new Date().getDay());

  save();
  render();
  setInterval(() => {
    updateCountdown();
    if (new Date().getSeconds() === 0) {
      renderToday();
    }
  }, 1000);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 어디 가야 하지?</title>
  <style>
    :root {
      color-scheme: light;
      --chalk: #24433a;
      --chalk-deep: #18322b;
      --chalk-line: rgba(255, 255, 255, 0.18);
      --paper: #fffdf4;
      --paper-line: #d8ebf2;
      --ink: #24312f;
      --muted: #6e7a75;
      --accent: #f4c542;
      --accent-2: #e7664f;
      --accent-3: #78b6d6;
      --shadow: 0 18px 40px rgba(22, 32, 29, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(244, 197, 66, 0.18), transparent 28%),
        linear-gradient(135deg, #f6ead4 0%, #e4f0ea 54%, #d6e6ef 100%);
      line-height: 1.45;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .board {
      position: relative;
      overflow: hidden;
      min-height: calc(100vh - 36px);
      padding: clamp(18px, 3vw, 34px);
      border: 12px solid #8d6038;
      border-radius: 8px;
      background:
        linear-gradient(var(--chalk-line) 1px, transparent 1px) 0 0 / 100% 44px,
        linear-gradient(90deg, rgba(255, 255, 255, 0.08), transparent 20%, rgba(0, 0, 0, 0.08)),
        var(--chalk);
      box-shadow: var(--shadow), inset 0 0 0 2px rgba(255, 255, 255, 0.1);
    }

    .board::before {
      content: "";
      position: absolute;
      inset: 12px;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .topbar {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      color: #f8f4dc;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 6vw, 4.8rem);
      line-height: 0.98;
      letter-spacing: 0;
      text-wrap: balance;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.22);
    }

    .date-pill {
      flex: 0 0 auto;
      padding: 10px 14px;
      border: 2px dashed rgba(255, 255, 255, 0.58);
      border-radius: 6px;
      color: #fff8d6;
      font-weight: 800;
      white-space: nowrap;
      background: rgba(0, 0, 0, 0.12);
    }

    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(300px, 0.85fr);
      gap: 18px;
      align-items: start;
    }

    .today-panel,
    .form-panel,
    .all-panel {
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
    }

    .today-panel {
      min-height: 340px;
      padding: clamp(18px, 3vw, 28px);
      background:
        repeating-linear-gradient(0deg, transparent 0 35px, var(--paper-line) 36px 37px),
        var(--paper);
      transform: rotate(-0.35deg);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    h2 {
      margin: 0;
      font-size: clamp(1.25rem, 3vw, 2rem);
      letter-spacing: 0;
    }

    .countdown {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 8px 12px;
      border: 2px solid #1f3f36;
      border-radius: 6px;
      color: #1f352f;
      font-size: clamp(0.96rem, 2vw, 1.1rem);
      font-weight: 900;
      background: #fff0a8;
      box-shadow: 3px 4px 0 rgba(36, 49, 47, 0.18);
      text-align: center;
    }

    .today-list,
    .saved-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .schedule-card {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      min-height: 74px;
      padding: 13px 14px;
      border: 2px solid rgba(36, 49, 47, 0.18);
      border-left: 12px solid var(--accent-3);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.78);
    }

    .schedule-card.past {
      opacity: 0.46;
      filter: grayscale(0.35);
    }

    .time {
      min-width: 78px;
      font-size: clamp(1.45rem, 5vw, 2.7rem);
      font-weight: 950;
      line-height: 1;
      color: #182f29;
    }

    .name {
      overflow-wrap: anywhere;
      font-size: clamp(1.18rem, 3.2vw, 2rem);
      font-weight: 900;
    }

    .day-tag {
      justify-self: start;
      padding: 4px 8px;
      border-radius: 999px;
      color: #20322e;
      font-size: 0.82rem;
      font-weight: 900;
      background: #cce8f3;
    }

    .empty {
      display: grid;
      min-height: 190px;
      place-items: center;
      margin: 12px 0 0;
      border: 2px dashed rgba(36, 49, 47, 0.26);
      border-radius: 8px;
      color: #1f352f;
      font-size: clamp(1.45rem, 5vw, 2.7rem);
      font-weight: 950;
      text-align: center;
      background: rgba(255, 255, 255, 0.46);
    }

    .side {
      display: grid;
      gap: 18px;
    }

    .form-panel,
    .all-panel {
      padding: 18px;
      transform: rotate(0.45deg);
    }

    .form-panel {
      background:
        linear-gradient(90deg, rgba(231, 102, 79, 0.35) 0 5px, transparent 5px),
        repeating-linear-gradient(0deg, transparent 0 31px, rgba(120, 182, 214, 0.28) 32px 33px),
        var(--paper);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      display: grid;
      gap: 6px;
      color: #40504b;
      font-size: 0.86rem;
      font-weight: 900;
    }

    .full {
      grid-column: 1 / -1;
    }

    input,
    select {
      width: 100%;
      min-height: 44px;
      border: 2px solid rgba(36, 49, 47, 0.28);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.82);
    }

    input:focus,
    select:focus {
      outline: 3px solid rgba(244, 197, 66, 0.55);
      border-color: #31564b;
    }

    .add-button {
      grid-column: 1 / -1;
      min-height: 48px;
      border: 0;
      border-radius: 6px;
      color: #1f2f2a;
      font-weight: 950;
      cursor: pointer;
      background: var(--accent);
      box-shadow: 3px 4px 0 rgba(36, 49, 47, 0.2);
    }

    .add-button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 2px 0 rgba(36, 49, 47, 0.22);
    }

    .all-panel {
      max-height: 360px;
      overflow: auto;
      background: #f8fbff;
    }

    .saved-list {
      gap: 9px;
    }

    .saved-list .schedule-card {
      min-height: 58px;
      grid-template-columns: auto minmax(0, 1fr) auto;
      padding: 10px;
      border-left-color: var(--accent-2);
      background: #ffffff;
    }

    .saved-list .time {
      min-width: 56px;
      font-size: 1.12rem;
    }

    .saved-list .name {
      font-size: 1rem;
    }

    .delete-button {
      width: 36px;
      height: 36px;
      border: 2px solid rgba(36, 49, 47, 0.2);
      border-radius: 6px;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      background: #d95749;
    }

    .hint {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    @media (max-width: 820px) {
      .app {
        padding: 10px;
      }

      .board {
        min-height: calc(100vh - 20px);
        padding: 16px;
        border-width: 8px;
      }

      .topbar,
      .section-title {
        align-items: stretch;
        flex-direction: column;
      }

      .date-pill,
      .countdown {
        width: 100%;
      }

      .hero-grid {
        grid-template-columns: 1fr;
      }

      .today-panel,
      .form-panel,
      .all-panel {
        transform: none;
      }

      .schedule-card {
        grid-template-columns: minmax(64px, auto) minmax(0, 1fr) auto;
      }

      .saved-list .schedule-card {
        grid-template-columns: 1fr auto;
      }

      .saved-list .day-tag {
        grid-column: 1 / 2;
      }

      .saved-list .time,
      .saved-list .name {
        grid-column: 1 / 2;
      }

      .saved-list .delete-button {
        grid-column: 2 / 3;
        grid-row: 1 / span 3;
      }
    }

    @media (max-width: 440px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .schedule-card {
        grid-template-columns: 1fr auto;
      }

      .today-list .time,
      .today-list .name,
      .today-list .day-tag {
        grid-column: 1 / 2;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="board" aria-label="오늘 일정 보드">
      <div class="topbar">
        <h1>오늘 어디 가야 하지?</h1>
        <div class="date-pill" id="todayLabel"></div>
      </div>

      <div class="hero-grid">
        <section class="today-panel" aria-labelledby="todayTitle">
          <div class="section-title">
            <h2 id="todayTitle">오늘 일정</h2>
            <div class="countdown" id="countdown">계산 중</div>
          </div>
          <ul class="today-list" id="todayList"></ul>
          <p class="empty" id="emptyToday" hidden>오늘 일정 없어요 ✨</p>
        </section>

        <div class="side">
          <section class="form-panel" aria-labelledby="formTitle">
            <div class="section-title">
              <h2 id="formTitle">일정 추가</h2>
            </div>
            <form class="form-grid" id="scheduleForm">
              <label>
                요일
                <select id="dayInput" required>
                  <option value="1">월요일</option>
                  <option value="2">화요일</option>
                  <option value="3">수요일</option>
                  <option value="4">목요일</option>
                  <option value="5">금요일</option>
                  <option value="6">토요일</option>
                  <option value="0">일요일</option>
                </select>
              </label>
              <label>
                시간
                <input id="timeInput" type="time" required>
              </label>
              <label class="full">
                이름
                <input id="nameInput" type="text" maxlength="32" placeholder="예: 영어학원" required>
              </label>
              <button class="add-button" type="submit">붙여두기</button>
            </form>
            <p class="hint">새로고침해도 브라우저에 저장돼요.</p>
          </section>

          <section class="all-panel" aria-labelledby="allTitle">
            <div class="section-title">
              <h2 id="allTitle">전체 스티커</h2>
            </div>
            <ul class="saved-list" id="savedList"></ul>
          </section>
        </div>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "today-where-to-go-schedules-v1";
    const dayNames = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];
    const colors = ["#78b6d6", "#f4c542", "#e7664f", "#96c77a", "#d99bd1"];

    const todayLabel = document.querySelector("#todayLabel");
    const countdown = document.querySelector("#countdown");
    const todayList = document.querySelector("#todayList");
    const emptyToday = document.querySelector("#emptyToday");
    const savedList = document.querySelector("#savedList");
    const form = document.querySelector("#scheduleForm");
    const dayInput = document.querySelector("#dayInput");
    const timeInput = document.querySelector("#timeInput");
    const nameInput = document.querySelector("#nameInput");

    let schedules = loadSchedules();

    function makeId() {
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function minutesToTime(totalMinutes) {
      const minutes = ((totalMinutes % 1440) + 1440) % 1440;
      return `${pad(Math.floor(minutes / 60))}:${pad(minutes % 60)}`;
    }

    function timeToMinutes(time) {
      const [hours, minutes] = time.split(":").map(Number);
      return hours * 60 + minutes;
    }

    function makeSeedData() {
      const now = new Date();
      const today = now.getDay();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const soon = Math.min(currentMinutes + 70, 21 * 60);
      const later = Math.min(soon + 90, 22 * 60);
      const yesterday = (today + 6) % 7;

      return [
        { id: makeId(), day: today, time: minutesToTime(soon), name: "방과후 코딩" },
        { id: makeId(), day: today, time: minutesToTime(later), name: "영어학원" },
        { id: makeId(), day: yesterday, time: "19:00", name: "수학 학원" }
      ];
    }

    function loadSchedules() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) {
        const seeded = makeSeedData();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
        return seeded;
      }

      try {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) {
          return parsed;
        }
      } catch {
        localStorage.removeItem(STORAGE_KEY);
      }

      const seeded = makeSeedData();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
      return seeded;
    }

    function saveSchedules() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(schedules));
    }

    function sortByDayThenTime(items) {
      return [...items].sort((a, b) => {
        if (Number(a.day) !== Number(b.day)) {
          return Number(a.day) - Number(b.day);
        }
        return a.time.localeCompare(b.time);
      });
    }

    function sortByTime(items) {
      return [...items].sort((a, b) => a.time.localeCompare(b.time));
    }

    function createScheduleItem(item, options = {}) {
      const li = document.createElement("li");
      li.className = "schedule-card";
      li.style.borderLeftColor = colors[Math.abs(Number(item.day)) % colors.length];

      if (options.past) {
        li.classList.add("past");
      }

      const time = document.createElement("strong");
      time.className = "time";
      time.textContent = item.time;

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = item.name;

      const day = document.createElement("span");
      day.className = "day-tag";
      day.textContent = dayNames[Number(item.day)];

      li.append(time, name, day);

      if (options.deletable) {
        const button = document.createElement("button");
        button.className = "delete-button";
        button.type = "button";
        button.setAttribute("aria-label", `${item.name} 삭제`);
        button.textContent = "×";
        button.addEventListener("click", () => {
          schedules = schedules.filter((schedule) => schedule.id !== item.id);
          saveSchedules();
          render();
        });
        li.append(button);
      }

      return li;
    }

    function updateDateLabel(now) {
      todayLabel.textContent = `${now.getMonth() + 1}월 ${now.getDate()}일 ${dayNames[now.getDay()]}`;
      dayInput.value = String(now.getDay());
    }

    function updateCountdown(todaySchedules, now) {
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const next = todaySchedules.find((item) => timeToMinutes(item.time) >= currentMinutes);

      if (!next) {
        countdown.textContent = todaySchedules.length ? "오늘 남은 일정 끝" : "오늘은 쉬는 날";
        return;
      }

      const diff = timeToMinutes(next.time) - currentMinutes;
      const hours = Math.floor(diff / 60);
      const minutes = diff % 60;
      countdown.textContent = `다음 일정까지 ${hours}시간 ${minutes}분 남음`;
    }

    function render() {
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const today = now.getDay();
      const todaySchedules = sortByTime(schedules.filter((item) => Number(item.day) === today));

      updateDateLabel(now);
      updateCountdown(todaySchedules, now);

      todayList.innerHTML = "";
      savedList.innerHTML = "";

      emptyToday.hidden = todaySchedules.length > 0;
      todaySchedules.forEach((item) => {
        todayList.append(createScheduleItem(item, {
          past: timeToMinutes(item.time) < currentMinutes
        }));
      });

      sortByDayThenTime(schedules).forEach((item) => {
        savedList.append(createScheduleItem(item, { deletable: true }));
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = nameInput.value.trim();

      if (!name) {
        nameInput.focus();
        return;
      }

      schedules.push({
        id: makeId(),
        day: Number(dayInput.value),
        time: timeInput.value,
        name
      });

      saveSchedules();
      nameInput.value = "";
      nameInput.focus();
      render();
    });

    timeInput.value = "18:00";
    render();
    setInterval(render, 30000);
  </script>
</body>
</html>

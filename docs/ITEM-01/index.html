<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수행평가 D-Day 보드</title>
  <style>
    :root {
      color-scheme: light;
      --chalk: #213c34;
      --chalk-deep: #172d27;
      --paper: #fffdf4;
      --paper-line: rgba(49, 97, 132, 0.16);
      --ink: #222722;
      --muted: #6a716b;
      --wood: #b98651;
      --pin: #e84c4c;
      --safe: #4f9f76;
      --soon: #d9a824;
      --urgent: #df4f4f;
      --shadow: 0 16px 40px rgba(25, 33, 25, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 22px 20px, rgba(255, 255, 255, 0.18) 0 2px, transparent 3px),
        linear-gradient(135deg, #31584d 0%, #1f3f37 48%, #17322c 100%);
      background-size: 44px 44px, auto;
    }

    .wrap {
      width: min(980px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 38px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: end;
      color: #f8f5df;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.7rem);
      line-height: 1.02;
      letter-spacing: 0;
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.16);
    }

    .date-chip {
      flex: 0 0 auto;
      border: 2px solid rgba(248, 245, 223, 0.55);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff7c9;
      font-weight: 800;
      background: rgba(0, 0, 0, 0.1);
    }

    .board {
      position: relative;
      border: 12px solid var(--wood);
      border-radius: 8px;
      padding: 18px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        var(--chalk);
      background-size: 100% 34px;
      box-shadow: var(--shadow), inset 0 0 0 2px rgba(255, 255, 255, 0.08);
    }

    .entry {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) 180px auto;
      gap: 10px;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(247, 244, 216, 0.12);
      border: 1px dashed rgba(255, 255, 255, 0.3);
    }

    input, button {
      font: inherit;
    }

    input {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 6px;
      padding: 0 14px;
      color: var(--ink);
      background: var(--paper);
      box-shadow: inset 0 -2px 0 rgba(80, 102, 92, 0.14);
      font-weight: 700;
      outline: 3px solid transparent;
    }

    input:focus {
      outline-color: rgba(255, 236, 132, 0.8);
    }

    button {
      min-height: 48px;
      border: 0;
      border-radius: 6px;
      padding: 0 18px;
      cursor: pointer;
      font-weight: 900;
      color: #1d261f;
      background: #ffe26a;
      box-shadow: 0 4px 0 #caa83e;
      transition: transform 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #caa83e;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }

    .card {
      position: relative;
      display: grid;
      grid-template-columns: 94px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      min-height: 128px;
      border: 4px solid rgba(69, 98, 84, 0.28);
      border-radius: 8px;
      padding: 16px 14px;
      background:
        linear-gradient(var(--paper-line) 1px, transparent 1px),
        var(--paper);
      background-size: 100% 24px;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.08);
      transform: rotate(var(--tilt, -0.4deg));
    }

    .card::before {
      content: "";
      position: absolute;
      top: -10px;
      left: 50%;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: var(--pin);
      box-shadow: inset -3px -3px 0 rgba(0, 0, 0, 0.15), 0 2px 4px rgba(0, 0, 0, 0.2);
      transform: translateX(-50%);
    }

    .card.urgent {
      border-color: rgba(223, 79, 79, 0.82);
      box-shadow: 0 8px 0 rgba(223, 79, 79, 0.18);
    }

    .card.soon {
      border-color: rgba(217, 168, 36, 0.82);
      box-shadow: 0 8px 0 rgba(217, 168, 36, 0.18);
    }

    .card.done {
      opacity: 0.5;
      filter: grayscale(0.3);
    }

    .card.done .title {
      text-decoration: line-through;
      text-decoration-thickness: 3px;
    }

    .dday {
      display: grid;
      place-items: center;
      width: 94px;
      min-height: 86px;
      border-radius: 8px;
      color: #fef9df;
      background: var(--safe);
      text-align: center;
      font-size: 1.85rem;
      font-weight: 1000;
      line-height: 1;
      box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.13);
    }

    .urgent .dday {
      background: var(--urgent);
    }

    .soon .dday {
      background: var(--soon);
      color: #2b230d;
    }

    .past .dday {
      background: #777;
    }

    .info {
      min-width: 0;
    }

    .title {
      overflow-wrap: anywhere;
      margin: 0 0 8px;
      font-size: 1.2rem;
      font-weight: 950;
    }

    .meta {
      color: var(--muted);
      font-weight: 800;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      color: #384039;
      cursor: pointer;
      user-select: none;
    }

    .check input {
      width: 22px;
      height: 22px;
      accent-color: var(--safe);
      box-shadow: none;
      cursor: pointer;
    }

    .delete {
      margin-left: auto;
      min-height: 34px;
      padding: 0 10px;
      color: #fff;
      background: #47544c;
      box-shadow: 0 3px 0 #2c342f;
      font-size: 0.9rem;
    }

    .empty {
      display: none;
      padding: 28px 12px;
      color: #f8f5df;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 800;
      border: 2px dashed rgba(255, 255, 255, 0.28);
      border-radius: 8px;
    }

    .cards:empty + .empty {
      display: block;
    }

    @media (max-width: 680px) {
      .wrap {
        width: min(100% - 20px, 980px);
        padding-top: 16px;
      }

      header {
        display: block;
      }

      .date-chip {
        display: inline-block;
        margin-top: 10px;
      }

      .board {
        border-width: 8px;
        padding: 12px;
      }

      .entry {
        grid-template-columns: 1fr;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        grid-template-columns: 82px minmax(0, 1fr);
        min-height: 116px;
        padding: 15px 12px;
      }

      .dday {
        width: 82px;
        min-height: 78px;
        font-size: 1.55rem;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1>수행평가<br>D-Day 보드</h1>
      </div>
      <div class="date-chip" id="todayText"></div>
    </header>

    <section class="board" aria-label="수행평가 마감일 관리">
      <form class="entry" id="taskForm">
        <input id="titleInput" type="text" autocomplete="off" placeholder="제목: 예) 통합사회 발표 자료" aria-label="수행평가 제목" required>
        <input id="dateInput" type="date" aria-label="마감일" required>
        <button type="submit">추가</button>
      </form>

      <div class="cards" id="cards"></div>
      <div class="empty">아직 붙인 메모가 없어요.</div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "school-dday-board-v1";
    const form = document.querySelector("#taskForm");
    const titleInput = document.querySelector("#titleInput");
    const dateInput = document.querySelector("#dateInput");
    const cards = document.querySelector("#cards");
    const todayText = document.querySelector("#todayText");

    const today = startOfDay(new Date());
    const samples = [
      { title: "국어 독서 감상문", dueDate: addDays(today, 2), done: false },
      { title: "과학 실험 보고서", dueDate: addDays(today, 6), done: false },
      { title: "영어 단어 테스트 준비", dueDate: addDays(today, -1), done: true }
    ];

    let tasks = loadTasks();

    todayText.textContent = new Intl.DateTimeFormat("ko-KR", {
      month: "long",
      day: "numeric",
      weekday: "short"
    }).format(today);
    dateInput.min = toDateValue(today);
    dateInput.value = toDateValue(addDays(today, 3));

    render();

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const title = titleInput.value.trim();
      const dueDate = dateInput.value;
      if (!title || !dueDate) return;

      tasks.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        title,
        dueDate,
        done: false
      });
      titleInput.value = "";
      dateInput.value = toDateValue(addDays(today, 3));
      titleInput.focus();
      saveAndRender();
    });

    cards.addEventListener("change", (event) => {
      const checkbox = event.target.closest("[data-done]");
      if (!checkbox) return;
      const task = tasks.find((item) => item.id === checkbox.dataset.done);
      if (!task) return;
      task.done = checkbox.checked;
      saveAndRender();
    });

    cards.addEventListener("click", (event) => {
      const button = event.target.closest("[data-delete]");
      if (!button) return;
      tasks = tasks.filter((item) => item.id !== button.dataset.delete);
      saveAndRender();
    });

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(saved) && saved.length > 0) return saved;
      } catch (error) {
        console.warn("저장된 데이터를 읽지 못했습니다.", error);
      }
      return samples.map((item, index) => ({
        id: `sample-${index + 1}`,
        title: item.title,
        dueDate: toDateValue(item.dueDate),
        done: item.done
      }));
    }

    function saveAndRender() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      render();
    }

    function render() {
      cards.innerHTML = "";
      sortedTasks().forEach((task, index) => {
        const days = diffDays(task.dueDate);
        const card = document.createElement("article");
        card.className = `card ${statusClass(days)} ${task.done ? "done" : ""}`;
        card.style.setProperty("--tilt", `${index % 2 === 0 ? -0.35 : 0.35}deg`);

        card.innerHTML = `
          <div class="dday">${ddayText(days)}</div>
          <div class="info">
            <h2 class="title"></h2>
            <div class="meta">${formatDate(task.dueDate)} 마감</div>
            <div class="actions">
              <label class="check">
                <input type="checkbox" data-done="${task.id}" ${task.done ? "checked" : ""}>
                완료
              </label>
              <button class="delete" type="button" data-delete="${task.id}">삭제</button>
            </div>
          </div>
        `;
        card.querySelector(".title").textContent = task.title;
        cards.appendChild(card);
      });
    }

    function sortedTasks() {
      return [...tasks].sort((a, b) => {
        if (a.done !== b.done) return Number(a.done) - Number(b.done);
        return new Date(a.dueDate) - new Date(b.dueDate);
      });
    }

    function statusClass(days) {
      if (days < 0) return "past urgent";
      if (days <= 3) return "urgent";
      if (days <= 7) return "soon";
      return "";
    }

    function ddayText(days) {
      if (days < 0) return "지남";
      if (days === 0) return "D-Day";
      return `D-${days}`;
    }

    function diffDays(dateValue) {
      const due = startOfDay(new Date(`${dateValue}T00:00:00`));
      return Math.round((due - today) / 86400000);
    }

    function startOfDay(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function addDays(date, amount) {
      const next = new Date(date);
      next.setDate(next.getDate() + amount);
      return next;
    }

    function toDateValue(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formatDate(dateValue) {
      return new Intl.DateTimeFormat("ko-KR", {
        month: "long",
        day: "numeric",
        weekday: "short"
      }).format(new Date(`${dateValue}T00:00:00`));
    }
  </script>
</body>
</html>
